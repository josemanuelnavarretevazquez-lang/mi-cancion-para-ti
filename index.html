<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🍌 PLATANO MUSIC</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --accent: #1db954;
            --accent-rgb: 29, 185, 84;
            --text-main: #ffffff;
            --text-secondary: #b3b3b3;
            --bg-card: rgba(20, 20, 20, 0.75);
            --ring-color: rgba(255, 255, 255, 0.2);
            --player-bg: rgba(20, 20, 20, 0.75);
            --input-bg: rgba(50, 50, 50, 0.7);
            --shadow-accent: 0 0 30px rgba(29, 185, 84, 0.4);
            --transition-speed: 0.4s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            height: -webkit-fill-available;
        }

        body {
            background: linear-gradient(135deg, #1b5e20 0%, #191414 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            transition: background 1.5s ease, color 1s ease;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body.light-mode {
            --text-main: #191414;
            --text-secondary: #555555;
            --bg-card: rgba(255, 255, 255, 0.7);
            --ring-color: rgba(0, 0, 0, 0.1);
            --player-bg: rgba(255, 255, 255, 0.65);
        }

        /* Rain Global */
        .rain-container-global {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .rain-item {
            position: absolute;
            animation: rainFall linear infinite;
            opacity: 0.85;
            pointer-events: none;
            will-change: transform;
            text-shadow: 0 0 8px currentColor;
        }
        @keyframes rainFall {
            0% {
                transform: translateY(-120px) rotate(0deg) scale(0.6);
                opacity: 0;
            }
            5% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.3);
                opacity: 0;
            }
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 10;
        }
        .screen.active {
            opacity: 1;
            pointer-events: all;
            z-index: 60;
        }

        /* Splash Screen */
        #splashScreen {
            background: radial-gradient(ellipse at center, rgba(29, 185, 84, 0.25) 0%, rgba(0, 0, 0, 0.7) 70%);
            z-index: 100;
            gap: 20px;
        }
        .splash-logo {
            font-size: 7rem;
            animation: fadeInScale 0.8s ease-out, glowPulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(29, 185, 84, 0.7));
        }
        .splash-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(29, 185, 84, 0.5);
            animation: fadeUp 0.8s ease-out 0.3s both;
        }
        .splash-subtitle {
            font-size: 1rem;
            font-weight: 400;
            color: #b3b3b3;
            letter-spacing: 6px;
            animation: fadeUp 0.8s ease-out 0.6s both;
        }
        .splash-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .splash-particle {
            position: absolute;
            animation: floatUp 4s ease-in infinite;
            opacity: 0;
            font-size: 1.5rem;
        }

        @keyframes fadeInScale {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        @keyframes glowPulse {
            0%,
            100% {
                filter: drop-shadow(0 0 30px rgba(29, 185, 84, 0.7));
            }
            50% {
                filter: drop-shadow(0 0 55px rgba(29, 185, 84, 1));
            }
        }
        @keyframes fadeUp {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes floatUp {
            0% {
                transform: translateY(110vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Login Screen */
        #loginScreen {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 90;
        }
        .login-card {
            background: rgba(30, 30, 30, 0.85);
            border-radius: 24px;
            padding: 35px 28px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            animation: cardPop 0.5s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        @keyframes cardPop {
            0% {
                transform: scale(0.85);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .login-logo {
            font-size: 3.5rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 15px rgba(29, 185, 84, 0.5));
        }
        .login-card h3 {
            color: #fff;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .login-card .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .login-card .input-group label {
            display: block;
            color: #b3b3b3;
            font-size: 0.8rem;
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .login-card .input-group input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: var(--input-bg);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .login-card .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.3);
            background: rgba(60, 60, 60, 0.7);
        }
        .login-card .input-group input::placeholder {
            color: #666;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(29, 185, 84, 0.4);
        }
        .login-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.6);
        }
        .login-error {
            color: #ff5252;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 20px;
            font-weight: 600;
        }

        /* Heartbeat Screen */
        #heartbeatScreen {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 85;
            gap: 25px;
        }
        .heartbeat-icon {
            font-size: 6rem;
            animation: heartbeatAnim 0.8s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(255, 23, 68, 0.8));
        }
        @keyframes heartbeatAnim {
            0%,
            100% {
                transform: scale(1);
            }
            14% {
                transform: scale(1.25);
            }
            28% {
                transform: scale(1);
            }
            42% {
                transform: scale(1.25);
            }
            56% {
                transform: scale(1);
            }
        }
        .heartbeat-text {
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
        }
        .heartbeat-progress-container {
            width: 220px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        .heartbeat-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            width: 0%;
            transition: width 0.8s ease;
            box-shadow: 0 0 12px rgba(29, 185, 84, 0.6);
        }

        /* Granted Screen */
        #grantedScreen {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 80;
            gap: 18px;
        }
        .granted-icon {
            font-size: 5rem;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            filter: drop-shadow(0 0 35px rgba(29, 185, 84, 0.9));
        }
        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .granted-text {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            animation: fadeUp 0.5s ease-out 0.3s both;
        }

        /* Player Wrapper */
        #playerWrapper {
            position: relative;
            z-index: 50;
            max-width: 380px;
            width: 100%;
            transform: translateY(15px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        #playerWrapper.hidden-initially {
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
        }
        #playerWrapper.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.5;
            filter: blur(60px);
            transition: all 1s ease;
        }
        .glow-1 {
            width: 180px;
            height: 180px;
            background: var(--accent);
            top: -40px;
            left: -50px;
            animation: glowFloat 6s ease-in-out infinite;
        }
        .glow-2 {
            width: 140px;
            height: 140px;
            background: var(--accent);
            bottom: -30px;
            right: -40px;
            animation: glowFloat 7s ease-in-out infinite reverse;
        }
        @keyframes glowFloat {
            0%,
            100% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(20px, -15px);
            }
            66% {
                transform: translate(-15px, 10px);
            }
        }

        /* Player Card */
        .player {
            padding: 30px 25px 25px;
            border-radius: 40px;
            background: var(--player-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
            position: relative;
            overflow: visible;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), var(--shadow-accent);
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: fadeIn 0.6s ease-out;
            transition: all 0.5s ease;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .player-brand {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 6px;
            opacity: 0.9;
            text-shadow: 0 0 12px rgba(29, 185, 84, 0.5);
        }
        #chapterIndicator {
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cover-container {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
        }
        .cover {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
            display: block;
        }
        .cover.playing {
            animation: spin 12s linear infinite;
        }
        .cover.transitioning {
            opacity: 0.3;
            transform: scale(0.9);
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .cover-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 2px dashed var(--ring-color);
            pointer-events: none;
            animation: ringRotate 20s linear infinite;
        }
        @keyframes ringRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Wave bars */
        .wave-bars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-bottom: 14px;
            height: 30px;
        }
        .wave-bars .banana-icon {
            font-size: 1.1rem;
            margin-right: 6px;
        }
        .wave-bar {
            width: 4px;
            height: 14px;
            background: var(--accent);
            border-radius: 4px;
            animation: wave 0.9s ease-in-out infinite;
            opacity: 0.7;
        }
        .wave-bar:nth-child(2) {
            animation-delay: 0.1s;
        }
        .wave-bar:nth-child(3) {
            animation-delay: 0.2s;
        }
        .wave-bar:nth-child(4) {
            animation-delay: 0.3s;
        }
        .wave-bar:nth-child(5) {
            animation-delay: 0.4s;
        }
        .wave-bar:nth-child(6) {
            animation-delay: 0.5s;
        }
        .wave-bar:nth-child(7) {
            animation-delay: 0.6s;
        }
        @keyframes wave {
            0%,
            100% {
                height: 10px;
            }
            50% {
                height: 26px;
            }
        }

        /* Progress */
        .progress-container {
            width: 100%;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
        }
        #progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            position: relative;
            overflow: visible;
        }
        #progress {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #1ed760, var(--accent));
            background-size: 200% 100%;
            border-radius: 10px;
            width: 0%;
            position: relative;
            transition: width 0.1s linear;
        }
        #progress.playing-bar {
            animation: moveWave 2s linear infinite;
        }
        @keyframes moveWave {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }
        #progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 13px;
            height: 13px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .progress-container:hover #progress::after,
        .progress-container:active #progress::after {
            opacity: 1;
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:active {
            transform: scale(0.85);
            color: #fff;
        }
        .ctrl-btn.active-ctrl {
            color: var(--accent);
        }
        .play-btn {
            width: 55px;
            height: 55px;
            background: #fff;
            color: #191414;
            border: none;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 6px 22px rgba(29, 185, 84, 0.5);
            flex-shrink: 0;
        }
        body.light-mode .play-btn {
            background: var(--accent);
            color: #fff;
        }
        .play-btn:active {
            transform: scale(0.9);
            box-shadow: 0 3px 12px rgba(29, 185, 84, 0.7);
        }

        /* Song info */
        .song-info {
            margin-bottom: 12px;
            position: relative;
        }
        .song-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-artist {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Like & Volume row */
        .extra-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        #likeBtn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px;
            transition: all 0.3s ease;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #likeBtn.liked {
            color: #e91e63;
            animation: likePop 0.4s ease;
        }
        @keyframes likePop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
            }
        }
        .volume-container {
            position: relative;
        }
        #volumeSliderContainer {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            padding: 10px;
            border-radius: 20px;
            display: none;
            z-index: 55;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #volumeSliderContainer.show {
            display: block;
        }
        #volumeSlider {
            -webkit-appearance: none;
            width: 100px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.6);
        }
        #volumeBtn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        /* Secret button */
        #secretBtn {
            width: 100%;
            padding: 10px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #ccc;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 12px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        #secretBtn:active {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            color: #fff;
        }

        /* Overlay & Modal */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #overlay.show {
            display: flex;
        }
        #loveMessage {
            background: rgba(30, 30, 30, 0.9);
            border-radius: 24px;
            padding: 30px 24px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 201;
        }
        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        #loveMessage .modal-title {

                if (isNaN(seconds) || seconds < 0) return '0:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return m + ':' + (s < 10 ? '0' : '') + s;
            }

            function getRandomBetween(min, max) {
                return Math.random() * (max - min) + min;
            }

                clearRain();

                for (let i = 0; i < density; i++) {
                    const span = document.createElement('span');
                    span.className = 'rain-item';
                    span.textContent = getRandomItem(items);
                    span.style.left = getRandomBetween(0, 100) + '%';
                    span.style.fontSize = getRandomBetween(1.2, 2.8) + 'rem';
                    span.style.color = getRandomItem(colors);
                    span.style.animationDuration = getRandomBetween(4, 10) + 's';
                    span.style.animationDelay = getRandomBetween(0, 8) + 's';
                    span.style.opacity = getRandomBetween(0.5, 0.9);
                    fragment.appendChild(span);
                }
                rainContainer.appendChild(fragment);
            }

                        if (callback) callback();

                    coverImg.onerror = () => {
                        coverImg.classList.remove('transitioning');
                        if (callback) callback();
                    };
                    setTimeout(() => {
                        if (coverImg.classList.contains('transitioning')) {
                            coverImg.classList.remove('transitioning');
                            if (callback) callback();
                        }
                    }, 600);
                }, 350);
            }

                if (index < 0) index = playlist.length - 1;

                const track = playlist[index];

                chapterIndicator.textContent = track.chapter;
                secretBtn.textContent = track.buttonLabel;
                modalTitle.textContent = track.messageTitle;
                modalText.textContent = track.messageText;
                document.title = '🍌 ' + track.title + ' - PLATANO MUSIC';

                applyTheme(track.accent, index);
                createRain(track.rainItems, track.rainColors);

                const wasPlaying = isPlaying;
                if (wasPlaying) {
                    audio.pause();
                }
                audio.src = track.src;
                audio.load();

                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
                durationEl.textContent = '0:00';

                const currentCover = coverImg.src;
                const newCover = track.cover;
                if (currentCover.indexOf(newCover) === -1) {
                    premiumTransition(track.cover, () => {
                        if (autoPlay || wasPlaying) {
                            safePlay();
                        }
                    });
                } else {
                    if (autoPlay || wasPlaying) {
                        safePlay();
                    }
                }

                if (!autoPlay && !wasPlaying) {
                    updatePlayButton();
                }

            function safePlay() {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        updatePlayButton();
                        coverImg.classList.add('playing');
                        progressFill.classList.add('playing-bar');
                    }).catch(err => {
                        console.warn('Play prevented:', err);
                        isPlaying = false;
                        updatePlayButton();
                        coverImg.classList.remove('playing');
                        progressFill.classList.remove('playing-bar');
                    });
                }
            }

                const vol = audio.volume;
                const icon = volumeBtn.querySelector('i');
                if (vol === 0) {
                    icon.className = 'fa-solid fa-volume-xmark';
                } else if (vol < 0.5) {
                    icon.className = 'fa-solid fa-volume-low';
                } else {
                    icon.className = 'fa-solid fa-volume-high';
                }

            function generateShuffleOrder() {
                const order = [];
                for (let i = 0; i < playlist.length; i++) {
                    if (i !== currentTrackIndex) order.push(i);
                }
                for (let i = order.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [order[i], order[j]] = [order[j], order[i]];
                }
                order.unshift(currentTrackIndex);
                return order;

                        '#ff6e40', '#ffd740', '#69f0ae'
                    ]);
                    phrase.style.animationDuration = getRandomBetween(3.5, 5.5) + 's';
                    document.body.appendChild(phrase);
                    setTimeout(() => {
                        if (phrase.parentNode) phrase.parentNode.removeChild(phrase);
                    }, 5500);
                }, 5000);
            }

            function stopFloatingPhrases() {
                if (floatingPhrasesInterval) {
                    clearInterval(floatingPhrasesInterval);
                    floatingPhrasesInterval = null;
                }
            }

            // ============ HEART EXPLOSION ============
            function createHeartExplosion(x, y) {
                const heartEmojis = ['❤️', '💕', '💖', '💗', '💘', '💝', '💟', '♥️', '🫶', '💓', '💞', '🥰'];
                const count = 16;
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('span');
                    particle.className = 'heart-particle';
                    particle.textContent = getRandomItem(heartEmojis);
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    const angle = (Math.PI * 2 * i) / count;
                    const distance = getRandomBetween(40, 100);
                    particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                    particle.style.setProperty('--ty', Math.sin(angle) * distance - getRandomBetween(20, 60) +
                        'px');
                    particle.style.animationDuration = getRandomBetween(0.8, 1.4) + 's';
                    document.body.appendChild(particle);
                    setTimeout(() => {
                        if (particle.parentNode) particle.parentNode.removeChild(particle);
                    }, 1500);
                }
                const textPop = document.createElement('span');
                textPop.className = 'love-text-pop';
                textPop.textContent = 'Te amo';
                textPop.style.left = x + 'px';
                textPop.style.top = (y - 10) + 'px';
                document.body.appendChild(textPop);
                setTimeout(() => {
                    if (textPop.parentNode) textPop.parentNode.removeChild(textPop);
                }, 2200);
            }

            // ============ HEARTBEAT SYNTH ============
            function playHeartbeat() {
                try {
                    if (!audioCtx) {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                } catch (e) {
                    console.warn('Web Audio API not supported');
                    return;
                }

                function beat() {
                    if (!audioCtx) return;
                    const now = audioCtx.currentTime;
                    const osc1 = audioCtx.createOscillator();
                    const gain1 = audioCtx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(50, now);
                    osc1.frequency.exponentialRampToValueAtTime(30, now + 0.1);
                    gain1.gain.setValueAtTime(0.6, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc1.connect(gain1);
                    gain1.connect(audioCtx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.2);

                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(55, now + 0.18);
                    osc2.frequency.exponentialRampToValueAtTime(25, now + 0.28);
                    gain2.gain.setValueAtTime(0.5, now + 0.18);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.start(now + 0.18);
                    osc2.stop(now + 0.4);
                }

                beat();
                heartbeatInterval = setInterval(beat, 800);
            }

            function stopHeartbeat() {
                if (heartbeatInterval) {
                    clearInterval(heartbeatInterval);
                    heartbeatInterval = null;
                }
            }

            // ============ SPLASH PARTICLES ============
            function createSplashParticles() {
                const emojis = ['🍌', '❤️', '💚', '✨', '💫', '🎵', '💿', '🌟'];
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < 25; i++) {
                    const particle = document.createElement('span');
                    particle.className = 'splash-particle';
                    particle.textContent = getRandomItem(emojis);
                    particle.style.left = getRandomBetween(0, 100) + '%';
                    particle.style.animationDuration = getRandomBetween(3, 7) + 's';
                    particle.style.animationDelay = getRandomBetween(0, 5) + 's';
                    particle.style.fontSize = getRandomBetween(1, 2.5) + 'rem';
                    fragment.appendChild(particle);
                }
                splashParticlesContainer.appendChild(fragment);
            }

            // ============ AUTH FLOW ============
            function showScreen(screen) {
                [splashScreen, loginScreen, heartbeatScreen, grantedScreen].forEach(s => s.classList.remove(
                    'active'));
                screen.classList.add('active');
            }

            function startHeartbeatSequence() {
                showScreen(heartbeatScreen);
                heartbeatProgressFill.style.width = '0%';
                playHeartbeat();

                const steps = [
                    { width: '25%', delay: 0 },
                    { width: '50%', delay: 800 },
                    { width: '75%', delay: 1600 },
                    { width: '100%', delay: 2400 },
                ];

                steps.forEach(step => {
                    setTimeout(() => {
                        heartbeatProgressFill.style.width = step.width;
                    }, step.delay);
                });

                setTimeout(() => {
                    stopHeartbeat();
                    showScreen(grantedScreen);
                    setTimeout(() => {
                        revealPlayer();
                    }, 1500);
                }, 3200);
            }

            function revealPlayer() {
                grantedScreen.classList.remove('active');
                playerWrapper.classList.remove('hidden-initially');
                playerWrapper.classList.add('visible');
                loadTrack(0, false);
                startFloatingPhrases();
            }

            // ============ EVENT LISTENERS ============

            // Splash → Login
            setTimeout(() => {
                splashScreen.classList.remove('active');
                loginScreen.classList.add('active');
            }, 2500);

            // Login
            loginBtnEl.addEventListener('click', () => {
                const email = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (email.toUpperCase() === VALID_EMAIL && password === VALID_PASSWORD) {
                    loginError.textContent = '';
                    loginScreen.classList.remove('active');
                    startHeartbeatSequence();
                } else {
                    loginError.textContent = 'Credenciales incorrectas. Intenta de nuevo.';
                    passwordInput.value = '';
                }
            });

            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') loginBtnEl.click();
            });
            usernameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') passwordInput.focus();
            });

            // Play / Pause
            playBtn.addEventListener('click', () => {
                if (!audio.src || audio.src === window.location.href) {
                    loadTrack(currentTrackIndex, true);
                    return;
                }
                if (isPlaying) {
                    audio.pause();
                    isPlaying = false;
                    coverImg.classList.remove('playing');
                    progressFill.classList.remove('playing-bar');
                } else {
                    safePlay();
                }
                updatePlayButton();
            });

            // Next
            nextBtn.addEventListener('click', () => {
                let nextIndex;
                if (isShuffle && shuffleOrder.length > 0) {
                    const currentShufflePos = shuffleOrder.indexOf(currentTrackIndex);
                    if (currentShufflePos < shuffleOrder.length - 1) {
                        nextIndex = shuffleOrder[currentShufflePos + 1];
                    } else {
                        shuffleOrder = generateShuffleOrder();
                        nextIndex = shuffleOrder[0];
                    }
                } else {
                    nextIndex = (currentTrackIndex + 1) % playlist.length;
                }
                const wasPlaying = isPlaying;
                isPlaying = false;
                coverImg.classList.remove('playing');
                progressFill.classList.remove('playing-bar');
                loadTrack(nextIndex, wasPlaying);
            });

            // Previous
            prevBtn.addEventListener('click', () => {
                if (audio.currentTime > 3) {
                    audio.currentTime = 0;
                    progressFill.style.width = '0%';
                    currentTimeEl.textContent = '0:00';
                    return;
                }
                let prevIndex;
                if (isShuffle && shuffleOrder.length > 0) {
                    const currentShufflePos = shuffleOrder.indexOf(currentTrackIndex);
                    if (currentShufflePos > 0) {
                        prevIndex = shuffleOrder[currentShufflePos - 1];
                    } else {
                        prevIndex = shuffleOrder[shuffleOrder.length - 1];
                    }
                } else {
                    prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
                }
                const wasPlaying = isPlaying;
                isPlaying = false;
                coverImg.classList.remove('playing');
                progressFill.classList.remove('playing-bar');
                loadTrack(prevIndex, wasPlaying);
            });

            // Shuffle
            shuffleBtn.addEventListener('click', () => {
                isShuffle = !isShuffle;
                if (isShuffle) {
                    shuffleBtn.classList.add('active-ctrl');
                    shuffleOrder = generateShuffleOrder();
                } else {
                    shuffleBtn.classList.remove('active-ctrl');
                    shuffleOrder = [];
                }
            });

            // Repeat
            repeatBtn.addEventListener('click', () => {
                isRepeat = !isRepeat;
                if (isRepeat) {
                    repeatBtn.classList.add('active-ctrl');
                } else {
                    repeatBtn.classList.remove('active-ctrl');
                }
            });

            // Like
            likeBtn.addEventListener('click', (e) => {
                isLiked = !isLiked;
                if (isLiked) {
                    likeBtn.classList.add('liked');
                    likeBtn.style.color = '#e91e63';
                    const rect = likeBtn.getBoundingClientRect();
                    createHeartExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2);
                } else {
                    likeBtn.classList.remove('liked');
                    likeBtn.style.color = '';
                }
            });

            // Volume
            volumeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                volumeSliderContainer.classList.toggle('show');
            });
            volumeSlider.addEventListener('input', () => {
                audio.volume = parseFloat(volumeSlider.value);
                updateVolumeIcon();
            });
            document.addEventListener('click', (e) => {
                if (!volumeSliderContainer.contains(e.target) && e.target !== volumeBtn) {
                    volumeSliderContainer.classList.remove('show');
                }
            });

            // Secret button / Modal
            secretBtn.addEventListener('click', () => {
                const track = playlist[currentTrackIndex];
                modalTitle.textContent = track.messageTitle;
                modalText.textContent = track.messageText;
                overlay.classList.add('show');
            });
            modalCloseBtn.addEventListener('click', () => {
                overlay.classList.remove('show');
            });
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.classList.remove('show');
            });

            // Progress bar
            function setProgressFromEvent(e) {
                const rect = progressBar.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
                const clickX = clientX - rect.left;
                const width = rect.width;
                const fraction = Math.max(0, Math.min(1, clickX / width));
                if (audio.duration && isFinite(audio.duration)) {
                    audio.currentTime = fraction * audio.duration;
                    progressFill.style.width = (fraction * 100) + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            }
            progressBar.addEventListener('click', setProgressFromEvent);
            progressBar.addEventListener('touchstart', setProgressFromEvent);
            progressBar.addEventListener('touchmove', (e) => {
                e.preventDefault();
                setProgressFromEvent(e);
            }, { passive: false });

            // Audio events
            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '0:00';
            });
            audio.addEventListener('timeupdate', () => {
                if (audio.duration && isFinite(audio.duration)) {
                    const fraction = audio.currentTime / audio.duration;
                    progressFill.style.width = (fraction * 100) + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            });
            audio.addEventListener('ended', () => {
                if (isRepeat) {
                    audio.currentTime = 0;
                    safePlay();
                } else {
                    nextBtn.click();
                }
            });
            audio.addEventListener('play', () => {
                isPlaying = true;
                updatePlayButton();
                coverImg.classList.add('playing');
                progressFill.classList.add('playing-bar');
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayButton();
                coverImg.classList.remove('playing');
                progressFill.classList.remove('playing-bar');
            });
            audio.addEventListener('error', () => {
                console.warn('Audio file could not be loaded:', audio.src);
                isPlaying = false;
                updatePlayButton();
                coverImg.classList.remove('playing');
                progressFill.classList.remove('playing-bar');
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (playerWrapper.classList.contains('hidden-initially')) return;
                if (e.target.tagName === 'INPUT') return;
                switch (e.code) {
                    case 'Space':
                        e.preventDefault();
                        playBtn.click();
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        if (e.shiftKey) nextBtn.click();
                        else audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        if (e.shiftKey) prevBtn.click();
                        else audio.currentTime = Math.max(0, audio.currentTime - 5);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        audio.volume = Math.min(1, audio.volume + 0.1);
                        volumeSlider.value = audio.volume;
                        updateVolumeIcon();
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        audio.volume = Math.max(0, audio.volume - 0.1);
                        volumeSlider.value = audio.volume;
                        updateVolumeIcon();
                        break;
                }
            });

            // ============ INITIALIZATION ============
            function init() {
                createSplashParticles();
                createRain(['❤️', '💚', '🍌', '✨', '💫'], ['#1db954', '#ff5252', '#ffd740', '#69f0ae',
                    '#ffffff'
                ], 30);
                audio.volume = 0.8;
                volumeSlider.value = 0.8;
                updateVolumeIcon();
                applyTheme(playlist[0].accent, 0);
            }

            init();

            console.log('🍌 PLATANO MUSIC - Fusionado con lo mejor de ambos mundos');
            console.log('💚 Credenciales: ' + VALID_EMAIL + ' / ' + VALID_PASSWORD);
            console.log('🎵 Playlist: ' + playlist.length + ' canciones cargadas');
            console.log('⌨️  Atajos: Espacio=Play | ←→=±5s | Shift+←→=Cambiar | ↑↓=Volumen');
        })();
    </script>
</body>
</html>
