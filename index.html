<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Para el amor de mi vida ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== RESET Y ESTILOS BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1db954 0%, #191414 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            overflow: hidden;
            position: relative;
            transition: background 1.5s ease;
        }

        /* ===== CONTENEDOR DE LA LLUVIA ===== */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .rain-item {
            position: absolute;
            animation: fall linear infinite;
            opacity: 0.8;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
            user-select: none;
            font-size: 24px;
            will-change: transform, opacity;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        /* ===== REPRODUCTOR ===== */
        .player {
            position: relative;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 30px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 30px rgba(29,185,84,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.2s ease;
            transition: box-shadow 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== PORTADA ===== */
        .cover-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 30px;
        }

        .cover {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 4px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 30px rgba(29,185,84,0.4);
            transition: transform 0.3s, box-shadow 1.5s ease;
        }

        .player.playing .cover {
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cover-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.3);
            pointer-events: none;
            transition: border-color 1.5s ease;
        }

        /* ===== TEXTO ===== */
        .song-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .artist {
            font-size: 1rem;
            color: #b3b3b3;
            font-weight: 400;
            margin-bottom: 25px;
        }

        /* ===== BARRA DE PROGRESO ===== */
        .progress-container {
            width: 100%;
            margin-bottom: 12px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #535353;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: visible;
        }
        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #1db954, #1ed760);
            border-radius: 3px;
            position: relative;
            transition: width 0.2s linear, background 1.5s ease;
            box-shadow: 0 0 10px rgba(29,185,84,0.6);
        }
        .progress::after {
            content: '';
            position: absolute;
            right: -7px;
            top: -5px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(29,185,84,0.8);
            transition: box-shadow 1.5s ease;
        }
        .time {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b3b3b3;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* ===== CONTROLES ===== */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }
        .control-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            outline: none;
        }
        .control-btn:active {
            color: #1db954;
            transform: scale(1.15);
        }

        .play-btn {
            background: #fff;
            border: none;
            color: #1e1e1e;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 25px rgba(29,185,84,0.6);
        }
        .play-btn:active {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(29,185,84,0.9);
        }

        /* ===== BOTÓN SECRETO ===== */
        .secret-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.4);
            color: #ddd;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
        }
        .secret-btn:active {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
        }

        /* ===== MODAL ===== */
        .love-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30,30,30,0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 320px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .love-message h2 {
            color: #ff4d6d;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .love-message p {
            color: #ddd;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #ff4d6d;
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .close-btn:active {
            background: #ff3355;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 99;
        }

        /* ===== DESTELLOS ===== */
        .glow {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.5); opacity: 0.7; }
        }

        /* ===== CORRECCIONES PARA SAFARI ===== */
        @supports (-webkit-touch-callout: none) {
            body {
                min-height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>

    <!-- DESTELLOS -->
    <div class="glow" style="top: 10%; left: 5%; width: 300px; height: 300px;"></div>
    <div class="glow" style="bottom: 15%; right: 8%; width: 400px; height: 400px; animation-delay: 3s;"></div>

    <!-- LLUVIA -->
    <div class="rain-container" id="rainContainer"></div>

    <!-- OVERLAY Y MODAL -->
    <div class="overlay" id="overlay"></div>
    <div class="love-message" id="loveMessage">
        <h2>💌 Mi amor...</h2>
        <p>
            Cada nota de esta canción es un latido de mi corazón por ti.<br>
            Eres lo más hermoso que me ha pasado.<br>
            Gracias por existir.<br>
            💕 Te amo infinitamente.
        </p>
        <button class="close-btn" id="closeMessage">Cerrar</button>
    </div>

    <!-- REPRODUCTOR -->
    <div class="player" id="player">
        <div class="cover-wrapper">
            <div class="cover-ring"></div>
            <img src="" alt="Portada de la canción" class="cover" id="cover">
        </div>
        <h1 class="song-title" id="title"></h1>
        <p class="artist" id="artist"></p>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button class="control-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn" id="play-btn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
        </div>

        <button class="secret-btn" id="secretBtn">💌 Tócame</button>
    </div>

    <audio id="audio" preload="auto"></audio>

    <script>
        // ================================================================
        // PLAYLIST - Nombres exactos de tus archivos en GitHub
        // ================================================================
        const playlist = [{
            title: "JOHANA ESMERALDA",
            artist: "De ti, para ti ❤️",
            src: "JOHANA ESMERALDA.mp3",
            cover: "WhatsApp Image 2026-08-01 at 23.00.20 (1).jpeg",
            theme: "linear-gradient(135deg, #1db954 0%, #191414 100%)",
            accent: "#1db954",
            rainItems: ['❤️', '❤️', '♥️', '❣️', '💖', '💗', '💘', '💝'],
            rainColors: ['#ff1744', '#ff5252', '#ff8a80', '#d50000', '#b71c1c']
        }, {
            title: "Mi Solecito de Mi Vida",
            artist: "Siempre tú 💖",
            src: "Mi Solecito de Mi Vida.mp3",
            cover: "WhatsApp Image 2026-08-01 at 23.00.20.jpeg",
            theme: "linear-gradient(135deg, #9b4dff 0%, #191414 100%)",
            accent: "#9b4dff",
            rainItems: ['🌻', '🌼', '🌸', '💛', '🌞', '🌟', '✨', '🌺'],
            rainColors: ['#ffd700', '#ffcc00', '#ffb300', '#ffaa00', '#ffe066']
        }];

        // ================================================================
        // DOM REFERENCIAS
        // ================================================================
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const playerDiv = document.getElementById('player');
        const cover = document.getElementById('cover');
        const coverRing = document.querySelector('.cover-ring');
        const songTitle = document.getElementById('title');
        const artist = document.getElementById('artist');
        const secretBtn = document.getElementById('secretBtn');
        const overlay = document.getElementById('overlay');
        const loveMessage = document.getElementById('loveMessage');
        const closeMessage = document.getElementById('closeMessage');
        const rainContainer = document.getElementById('rainContainer');

        let currentTrack = 0;

        // ================================================================
        // FUNCIONES
        // ================================================================

        function createRain(items, colors) {
            rainContainer.innerHTML = '';
            const count = 50;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('span');
                el.className = 'rain-item';
                const emoji = items[Math.floor(Math.random() * items.length)];
                el.textContent = emoji;
                el.style.left = Math.random() * 100 + '%';
                const size = Math.random() * 22 + 16;
                el.style.fontSize = size + 'px';
                el.style.color = colors[Math.floor(Math.random() * colors.length)];
                el.style.animationDuration = (Math.random() * 10 + 8) + 's';
                el.style.animationDelay = (Math.random() * 8) + 's';
                el.style.opacity = Math.random() * 0.5 + 0.4;
                rainContainer.appendChild(el);
            }
        }

        function applyTheme(accentColor) {
            playerDiv.style.boxShadow = `0 25px 50px rgba(0,0,0,0.7), 0 0 30px ${accentColor}40`;
            cover.style.boxShadow = `0 0 30px ${accentColor}60`;
            coverRing.style.borderColor = `${accentColor}80`;
            progress.style.background = `linear-gradient(to right, ${accentColor}, ${accentColor}cc)`;
            progress.style.boxShadow = `0 0 10px ${accentColor}80`;
            document.querySelector('.progress::after').style.boxShadow = `0 0 12px ${accentColor}cc`;
            playBtn.style.boxShadow = `0 0 25px ${accentColor}80`;
        }

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            songTitle.textContent = track.title;
            artist.textContent = track.artist;
            cover.src = track.cover;
            cover.alt = `Portada de ${track.title}`;

            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';

            document.body.style.background = track.theme;
            applyTheme(track.accent);
            createRain(track.rainItems, track.rainColors);

            const wasPlaying = !audio.paused;
            audio.load();
            if (wasPlaying) {
                audio.play().then(() => {
                    playerDiv.classList.add('playing');
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }).catch(() => {
                    playerDiv.classList.remove('playing');
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                });
            } else {
                playerDiv.classList.remove('playing');
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgress() {
            const { currentTime, duration } = audio;
            if (duration) {
                const percent = (currentTime / duration) * 100;
                progress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(currentTime);
                durationEl.textContent = formatTime(duration);
            }
        }

        function setProgress(e) {
            const rect = progressBar.getBoundingClientRect();
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            if (x === undefined) return;
            const clickX = x - rect.left;
            const width = rect.width;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playerDiv.classList.add('playing');
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }).catch(() => {
                    alert("No se pudo reproducir el audio. Asegúrate de que el archivo exista y sea válido.");
                });
            } else {
                audio.pause();
                playerDiv.classList.remove('playing');
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        function nextTrack() {
            currentTrack = (currentTrack + 1) % playlist.length;
            loadTrack(currentTrack);
        }

        function prevTrack() {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack);
        }

        // Manejo de errores de audio
        audio.addEventListener('error', function(e) {
            console.error('Error cargando audio:', e);
            alert('No se pudo cargar el archivo de audio. Verifica que el archivo exista en la carpeta.');
        });

        // ================================================================
        // EVENTOS
        // ================================================================

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        progressBar.addEventListener('click', setProgress);
        progressBar.addEventListener('touchstart', function(e) {
            e.preventDefault();
            setProgress(e);
        }, { passive: false });
        progressBar.addEventListener('touchmove', function(e) {
            e.preventDefault();
            setProgress(e);
        }, { passive: false });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });
        audio.addEventListener('ended', nextTrack);

        secretBtn.addEventListener('click', () => {
            overlay.style.display = 'block';
            loveMessage.style.display = 'block';
        });
        closeMessage.addEventListener('click', () => {
            overlay.style.display = 'none';
            loveMessage.style.display = 'none';
        });
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            loveMessage.style.display = 'none';
        });

        // Inicio
        window.addEventListener('DOMContentLoaded', () => {
            loadTrack(currentTrack);
        });
    </script>
</body>
</html>
