<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Para el amor de mi vida ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET Y ESTILOS BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1db954 0%, #191414 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            overflow: hidden;
            position: relative;
            transition: background 1.5s ease;
        }

        /* ===== DESTELLOS ===== */
        .glow {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.5); opacity: 0.7; }
        }

        /* ===== CONTENEDOR DE LA LLUVIA ===== */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .rain-item {
            position: absolute;
            animation: fall linear infinite;
            opacity: 0.8;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
            user-select: none;
            will-change: transform, opacity;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        /* ===== REPRODUCTOR ===== */
        .player {
            position: relative;
            background: rgba(18, 18, 18, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 40px;
            padding: 35px 25px 25px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 30px rgba(29,185,84,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.2s ease;
            transition: box-shadow 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== PORTADA ===== */
        .cover-wrapper {
            display: inline-block;
            position: relative;
            margin-bottom: 20px;
        }

        .cover {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 4px solid rgba(255,255,255,0.15);
            box-shadow: 0 0 30px rgba(29,185,84,0.4);
            transition: transform 0.3s, box-shadow 1.5s ease;
        }

        .player.playing .cover {
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .cover-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.3);
            pointer-events: none;
            transition: border-color 1.5s ease;
        }

        /* ===== ONDA DE AUDIO Y SPOTIFY ===== */
        .audio-wave-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #b3b3b3;
        }

        .spotify-icon {
            font-size: 1.6rem;
            color: #1db954;
        }

        .wave-lines {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 25px;
        }

        .wave-line {
            width: 3.5px;
            height: 8px;
            background: #b3b3b3;
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .player.playing .wave-line {
            animation: wave 1s ease-in-out infinite alternate;
        }

        .player.playing .wave-line:nth-child(1) { animation-delay: 0.1s; }
        .player.playing .wave-line:nth-child(2) { animation-delay: 0.3s; }
        .player.playing .wave-line:nth-child(3) { animation-delay: 0.5s; }
        .player.playing .wave-line:nth-child(4) { animation-delay: 0.2s; }
        .player.playing .wave-line:nth-child(5) { animation-delay: 0.4s; }
        .player.playing .wave-line:nth-child(6) { animation-delay: 0.1s; }
        .player.playing .wave-line:nth-child(7) { animation-delay: 0.6s; }

        @keyframes wave {
            0% { height: 6px; }
            100% { height: 24px; background: #fff; }
        }

        /* ===== BARRA DE PROGRESO ===== */
        .progress-container {
            width: 100%;
            margin-bottom: 8px;
        }
        .progress-bar {
            width: 100%;
            height: 5px;
            background: #404040;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress {
            height: 100%;
            width: 0%;
            background: #1db954;
            border-radius: 3px;
            position: relative;
            transition: width 0.1s linear;
        }
        .progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4.5px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .time {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #b3b3b3;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* ===== CONTROLES PRINCIPALES ===== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
            outline: none;
        }

        .control-btn:hover {
            color: #fff;
        }

        .control-btn.active {
            color: #1db954 !important;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-btn {
            background: #fff;
            border: none;
            color: #000;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(29,185,84,0.5);
            padding-left: 3px; /* Óptico para el icono play */
        }

        .player.playing .play-btn {
            padding-left: 0;
        }

        .play-btn:active {
            transform: scale(1.05);
        }

        /* ===== TEXTO Y LIKE ===== */
        .song-info-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .song-text {
            overflow: hidden;
        }

        .song-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .artist {
            font-size: 0.85rem;
            color: #b3b3b3;
            font-weight: 400;
            margin-top: 2px;
        }

        .like-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .like-btn.liked {
            color: #ff4d6d;
        }

        .like-btn:active {
            transform: scale(1.2);
        }

        /* ===== BOTÓN SECRETO ===== */
        .secret-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.3);
            color: #ddd;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
        }
        .secret-btn:hover {
            background: rgba(255,255,255,0.1);
            border-color: #fff;
        }

        /* ===== MODAL ===== */
        .love-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(25,25,25,0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 35px 25px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .love-message h2 {
            color: #ff4d6d;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        .love-message p {
            color: #ddd;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #ff4d6d;
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 99;
        }
    </style>
</head>
<body>

    <!-- DESTELLOS -->
    <div class="glow" style="top: 10%; left: 5%; width: 300px; height: 300px;"></div>
    <div class="glow" style="bottom: 15%; right: 8%; width: 400px; height: 400px; animation-delay: 3s;"></div>

    <!-- LLUVIA -->
    <div class="rain-container" id="rainContainer"></div>

    <!-- OVERLAY Y MODAL -->
    <div class="overlay" id="overlay"></div>
    <div class="love-message" id="loveMessage">
        <h2>💌 Mi amor...</h2>
        <p>
            Cada nota de esta canción es un latido de mi corazón por ti.<br>
            Eres lo más hermoso que me ha pasado.<br>
            Gracias por existir.<br>
            💕 Te amo infinitamente.
        </p>
        <button class="close-btn" id="closeMessage">Cerrar</button>
    </div>

    <!-- REPRODUCTOR -->
    <div class="player" id="player">
        <div class="cover-wrapper">
            <div class="cover-ring"></div>
            <img src="" alt="Portada de la canción" class="cover" id="cover">
        </div>

        <!-- ONDA SPOTIFY -->
        <div class="audio-wave-bar">
            <i class="fab fa-spotify spotify-icon"></i>
            <div class="wave-lines">
                <div class="wave-line"></div>
                <div class="wave-line"></div>
                <div class="wave-line"></div>
                <div class="wave-line"></div>
                <div class="wave-line"></div>
                <div class="wave-line"></div>
                <div class="wave-line"></div>
            </div>
        </div>

        <!-- BARRA DE PROGRESO -->
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
        </div>
        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <!-- CONTROLES ESTILO SPOTIFY -->
        <div class="controls">
            <button class="control-btn" id="shuffle-btn"><i class="fas fa-random"></i></button>
            <button class="control-btn" id="prev-btn"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn" id="play-btn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="next-btn"><i class="fas fa-step-forward"></i></button>
            <button class="control-btn" id="repeat-btn"><i class="fas fa-redo-alt"></i></button>
        </div>

        <!-- TÍTULO, ARTISTA Y ME GUSTA -->
        <div class="song-info-container">
            <div class="song-text">
                <h1 class="song-title" id="title"></h1>
                <p class="artist" id="artist"></p>
            </div>
            <button class="like-btn" id="likeBtn"><i class="fas fa-heart"></i></button>
        </div>

        <button class="secret-btn" id="secretBtn">💌 Tócame</button>
    </div>

    <audio id="audio" preload="auto"></audio>

    <script>
        // ================================================================
        // PLAYLIST
        // ================================================================
        const playlist = [{
            title: "JOHANA ESMERALDA",
            artist: "De ti, para ti ❤️",
            src: "JOHANA ESMERALDA.mp3",
            cover: "WhatsApp Image 2026-08-01 at 23.00.20 (1).jpeg",
            theme: "linear-gradient(135deg, #1db954 0%, #191414 100%)", // verde
            accent: "#1db954",
            rainItems: ['❤️', '♥️', '💖', '💗'], // Solo Corazones Rojos
            rainColors: ['#ff1744', '#ff5252', '#ff8a80', '#d50000', '#b71c1c']
        }, {
            title: "Mi Solecito de Mi Vida",
            artist: "Siempre tú 💖",
            src: "Mi Solecito de Mi Vida.mp3",
            cover: "WhatsApp Image 2026-08-01 at 23.00.20.jpeg",
            theme: "linear-gradient(135deg, #9b4dff 0%, #191414 100%)", // morado
            accent: "#9b4dff",
            rainItems: ['🌻', '🌼', '🟡'], // Solo Flores y Destellos Amarillos
            rainColors: ['#ffd700', '#ffcc00', '#ffb300', '#ffaa00', '#ffe066']
        }];

        // ================================================================
        // REFERENCIAS DOM
        // ================================================================
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const likeBtn = document.getElementById('likeBtn');
        const progressBar = document.getElementById('progress-bar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const playerDiv = document.getElementById('player');
        const cover = document.getElementById('cover');
        const coverRing = document.querySelector('.cover-ring');
        const songTitle = document.getElementById('title');
        const artist = document.getElementById('artist');
        const secretBtn = document.getElementById('secretBtn');
        const overlay = document.getElementById('overlay');
        const loveMessage = document.getElementById('loveMessage');
        const closeMessage = document.getElementById('closeMessage');
        const rainContainer = document.getElementById('rainContainer');

        let currentTrack = 0;
        let isShuffle = false;
        let isRepeat = false;

        // ================================================================
        // FUNCIONES
        // ================================================================

        function createRain(items, colors) {
            rainContainer.innerHTML = '';
            const count = 40;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('span');
                el.className = 'rain-item';
                el.textContent = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 20 + 16) + 'px';
                el.style.color = colors[Math.floor(Math.random() * colors.length)];
                el.style.animationDuration = (Math.random() * 8 + 6) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                rainContainer.appendChild(el);
            }
        }

        function applyTheme(accentColor) {
            playerDiv.style.boxShadow = `0 25px 50px rgba(0,0,0,0.7), 0 0 30px ${accentColor}40`;
            cover.style.boxShadow = `0 0 30px ${accentColor}60`;
            coverRing.style.borderColor = `${accentColor}80`;
            progress.style.background = accentColor;
            playBtn.style.boxShadow = `0 0 20px ${accentColor}80`;
            document.querySelector('.spotify-icon').style.color = accentColor;
        }

        function loadTrack(index, autoPlay = false) {
            const track = playlist[index];
            audio.src = track.src;
            songTitle.textContent = track.title;
            artist.textContent = track.artist;
            cover.src = track.cover;

            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';

            document.body.style.background = track.theme;
            applyTheme(track.accent);
            createRain(track.rainItems, track.rainColors);

            audio.load();

            if (autoPlay) {
                audio.play().then(() => {
                    playerDiv.classList.add('playing');
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }).catch(() => resetPlayState());
            } else {
                resetPlayState();
            }
        }

        function resetPlayState() {
            audio.pause();
            playerDiv.classList.remove('playing');
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgress() {
            const { currentTime, duration } = audio;
            if (duration) {
                const percent = (currentTime / duration) * 100;
                progress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(currentTime);
                durationEl.textContent = formatTime(duration);
            }
        }

        function setProgress(e) {
            const rect = progressBar.getBoundingClientRect();
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            if (x === undefined) return;
            const clickX = x - rect.left;
            const width = rect.width;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playerDiv.classList.add('playing');
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                }).catch(() => alert("Asegúrate de tener el archivo de audio localmente."));
            } else {
                resetPlayState();
            }
        }

        function nextTrack() {
            if (isShuffle) {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * playlist.length);
                } while (newIndex === currentTrack && playlist.length > 1);
                currentTrack = newIndex;
            } else {
                currentTrack = (currentTrack + 1) % playlist.length;
            }
            loadTrack(currentTrack, false); // No auto-reproducir para reiniciar el botón a Play
        }

        function prevTrack() {
            currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrack, false); // No auto-reproducir para reiniciar el botón a Play
        }

        // ================================================================
        // EVENTOS
        // ================================================================
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        });

        likeBtn.addEventListener('click', () => {
            likeBtn.classList.toggle('liked');
        });

        progressBar.addEventListener('click', setProgress);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play();
            } else {
                nextTrack();
            }
        });

        secretBtn.addEventListener('click', () => {
            overlay.style.display = 'block';
            loveMessage.style.display = 'block';
        });

        closeMessage.addEventListener('click', () => {
            overlay.style.display = 'none';
            loveMessage.style.display = 'none';
        });

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            loveMessage.style.display = 'none';
        });

        // Carga inicial
        window.addEventListener('DOMContentLoaded', () => {
            loadTrack(currentTrack, false);
        });
    </script>
</body>
</html>
